<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B6E78">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Estrellas">
<title>Estrellas del Hogar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: banda de color con las estrellas del niño arriba; debajo, una columna con pestañas Tareas / Premios / Papás. */
:root{
  --font-display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --bg:#EEF5F3;
  --surface:#FFFFFF;
  --field:#F6FAF9;
  --ink:#12303A;
  --muted:#56707A;
  --line:#D3E2DF;
  --band:#0B6E78;
  --band-ink:#FFFFFF;
  --band-soft:rgba(255,255,255,.22);
  --btn:#0B6E78;
  --btn-ink:#FFFFFF;
  --star:#F2B01E;
  --star-deep:#B97E00;
  --star-text:#8A5C00;
  --ok:#17744B;
  --ok-bg:#DDF3E7;
  --wait:#9A4F00;
  --wait-bg:#FDEBD0;
  --danger:#B83A27;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1B1F;--surface:#15292F;--field:#102227;--ink:#E6F1F0;--muted:#93AEB4;--line:#264149;
    --band:#134A52;--band-ink:#F3FBFA;--band-soft:rgba(255,255,255,.16);
    --btn:#3FB7C2;--btn-ink:#05252A;
    --star:#FFC93C;--star-deep:#E3A400;--star-text:#FFC93C;
    --ok:#5FD39B;--ok-bg:#17382B;--wait:#F0A44B;--wait-bg:#3A2B14;--danger:#FF8A75;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1B1F;--surface:#15292F;--field:#102227;--ink:#E6F1F0;--muted:#93AEB4;--line:#264149;
  --band:#134A52;--band-ink:#F3FBFA;--band-soft:rgba(255,255,255,.16);
  --btn:#3FB7C2;--btn-ink:#05252A;
  --star:#FFC93C;--star-deep:#E3A400;--star-text:#FFC93C;
  --ok:#5FD39B;--ok-bg:#17382B;--wait:#F0A44B;--wait-bg:#3A2B14;--danger:#FF8A75;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--font-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
button,input{font-family:inherit}
:focus-visible{outline:3px solid var(--star);outline-offset:2px}

.inner{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Banda con el saldo */
.band{background:var(--band);color:var(--band-ink);padding-block:18px 22px}
.band h1{margin:0;font:700 22px/1.2 var(--font-display);overflow-wrap:anywhere}
.count{display:flex;align-items:center;gap:10px;margin-top:6px}
.count .st-big{width:clamp(44px,12vw,60px);height:clamp(44px,12vw,60px);flex:none}
.num{display:inline-block;font:800 clamp(56px,17vw,84px)/1 var(--font-display);font-variant-numeric:tabular-nums}
.unit{align-self:flex-end;padding-bottom:10px;font:700 18px/1 var(--font-display);opacity:.92}
.goal{margin-top:12px}
.goal p{margin:0 0 6px;font-weight:700}
.bar{height:12px;border-radius:999px;background:var(--band-soft);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--star)}
.bar.on-surface{background:var(--line)}
.linkbtn{margin-top:8px;padding:6px 0;min-height:44px;border:0;background:none;color:inherit;font:700 15px var(--font-body);text-decoration:underline;text-underline-offset:3px;cursor:pointer;text-align:left}

/* Pestañas */
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin-top:16px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.tab{min-height:44px;border:0;border-radius:12px;background:transparent;color:var(--ink);font:700 16px var(--font-display);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.tab[aria-current="page"]{background:var(--btn);color:var(--btn-ink)}
.tab .ic{width:16px;height:16px}

.main{padding-block:8px 40px}
h2{margin:14px 0 2px;font:700 22px/1.2 var(--font-display)}
h3{margin:0 0 4px;font:700 18px/1.25 var(--font-display)}
.sub{margin:0 0 12px;color:var(--muted)}
.segs{display:flex;gap:4px;margin:6px 0 14px}
.segs i{flex:1;height:8px;border-radius:99px;background:var(--line)}
.segs i.ok{background:var(--ok)}
.segs i.p{background:var(--star)}

.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.task{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.t-main{min-width:0;display:flex;flex-direction:column;gap:2px}
.name{font-weight:800;overflow-wrap:anywhere}
.task.done .name{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;font-weight:800;color:var(--star-text)}
.st{width:18px;height:18px;flex:none}
.t-act{flex:none}

.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;font-weight:800;font-size:14px;white-space:nowrap}
.pill .ic{width:16px;height:16px}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.wait{background:var(--wait-bg);color:var(--wait)}

.btn{min-height:44px;padding:0 16px;border:0;border-radius:12px;background:var(--btn);color:var(--btn-ink);font:700 16px var(--font-display);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--line)}
.btn.sm{padding:0 12px;font-size:15px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.icon-btn{width:44px;height:44px;border:1.5px solid var(--line);border-radius:10px;background:transparent;color:var(--danger);cursor:pointer;display:grid;place-items:center}
.icon-btn .ic{width:20px;height:20px}

.prizes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.prize{display:flex;flex-direction:column;gap:10px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.prize h3{margin:0;overflow-wrap:anywhere}
.cost{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:800}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.confirm p{margin:0;flex-basis:100%;font-weight:700}

.panel{margin-top:14px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.row2{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.row2:first-of-type{border-top:0}
.row2 .t-main{flex:1 1 160px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.empty{margin:0;color:var(--muted)}
.lbl{display:block;margin:10px 0 4px;font-weight:700;font-size:14px}
.in{width:100%;min-width:0;min-height:44px;padding:0 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink);font:600 16px var(--font-body)}
.erow{display:grid;grid-template-columns:minmax(0,1fr) 72px 44px;gap:8px;align-items:center;margin-top:8px}
.arow{display:grid;grid-template-columns:minmax(0,1fr) 72px auto;gap:8px;align-items:center;margin-top:12px}
.colhead{display:grid;grid-template-columns:minmax(0,1fr) 72px 44px;gap:8px;font-size:13px;font-weight:700;color:var(--muted);margin-top:8px}
.err{margin:8px 0 0;color:var(--danger);font-weight:700}
.hint{margin:8px 0 0;color:var(--muted);font-size:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sync{margin:24px 0 0;color:var(--muted);font-size:13px}

.toast{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:480px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:700;z-index:20}
.ic{width:1.1em;height:1.1em;flex:none}

@media (prefers-reduced-motion:no-preference){
  .bar>i{transition:width .45s ease}
  .bump{animation:bump .5s}
  @keyframes bump{40%{transform:scale(1.18)}}
  .toast:not([hidden]){animation:rise .25s ease-out}
  @keyframes rise{from{transform:translateY(12px);opacity:0}}
}
</style>
<style>
:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);color-scheme:light dark}
body{margin:0}
[hidden]{display:none!important}
</style>
</head>
<body>

<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
'use strict';

var LS_KEY='estrellas-del-hogar-v1';
var DEFAULTS={
  v:1,name:'Campeón',pin:'1234',base:0,
  tasks:[
    {id:'t1',n:'Tender la cama',s:1},
    {id:'t2',n:'Recoger los juguetes',s:1},
    {id:'t3',n:'Lavar los platos',s:2},
    {id:'t4',n:'Sacar la basura',s:2},
    {id:'t5',n:'Barrer la sala',s:2},
    {id:'t6',n:'Ayudar a cocinar',s:3}
  ],
  prizes:[
    {id:'p1',n:'Elegir la película de la noche',c:10},
    {id:'p2',n:'30 minutos extra de tablet',c:15},
    {id:'p3',n:'Un helado',c:20},
    {id:'p4',n:'Salida al parque',c:30},
    {id:'p5',n:'Un juguete pequeño',c:60}
  ],
  log:[]
};

var S=clone(DEFAULTS);
var tab='tareas',unlocked=false,confirmId=null,gateErr='';
var dbDoc=null,mode='',timer=null,seen=false;
var writing=false,dirty=false,deferred=false,prevBal=null,renderedDay='',toastTimer=null,lastKey='';

var SYNC={
  cloud:'Los datos se guardan en la nube y se sincronizan entre dispositivos.',
  local:'Los datos se guardan solo en este dispositivo.',
  offline:'No hay conexión con el guardado. Puede que los datos no estén al día.',
  nowrite:'Tu acceso es de solo lectura: los cambios no se guardan.'
};

var ICON={
  star:function(c){return '<svg class="'+(c||'st')+'" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6l2.9 6.1 6.7.9-4.9 4.7 1.2 6.6L12 17.6l-5.9 3.3 1.2-6.6L2.4 9.6l6.7-.9z" fill="var(--star)" stroke="var(--star-deep)" stroke-width="1.4" stroke-linejoin="round"/></svg>';},
  check:'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  clock:'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 7v5.5l3.5 2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  trash:'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 7V4.5h4V7m-8.5 0l1 12.5h11l1-12.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  lock:'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8.5 10.5V8a3.5 3.5 0 017 0v2.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'
};

function clone(o){return JSON.parse(JSON.stringify(o));}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function stable(v){
  if(Array.isArray(v))return '['+v.map(stable).join(',')+']';
  if(v&&typeof v==='object')return '{'+Object.keys(v).sort().map(function(k){return JSON.stringify(k)+':'+stable(v[k]);}).join(',')+'}';
  return JSON.stringify(v);
}
function todayKey(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function shortDate(k){var p=k.split('-');return p[2]+'/'+p[1];}
function longToday(){
  var s=new Date().toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'});
  return s.charAt(0).toUpperCase()+s.slice(1);
}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function plural(n){return n===1?'estrella':'estrellas';}
function clampInt(v,min,max,fallback){var n=parseInt(v,10);if(!isFinite(n))return fallback;return Math.max(min,Math.min(max,n));}

function normalize(d){
  var o=clone(d);
  return {
    v:1,
    name:(typeof o.name==='string'&&o.name)?o.name:'Campeón',
    pin:/^\d{4}$/.test(o.pin)?String(o.pin):'1234',
    base:isFinite(o.base)?o.base:0,
    tasks:Array.isArray(o.tasks)?o.tasks:[],
    prizes:Array.isArray(o.prizes)?o.prizes:[],
    log:Array.isArray(o.log)?o.log:[]
  };
}

function balance(s){
  var b=s.base||0;
  s.log.forEach(function(e){
    if(e.k==='t'&&e.st==='ok')b+=e.s;
    else if(e.k==='p')b-=e.c;
  });
  return b;
}

/* Los movimientos viejos ya cerrados se suman a "base" para que el documento no crezca sin límite. */
function prune(){
  if(S.log.length<=300)return;
  var keep=[],excess=S.log.length-250;
  S.log.forEach(function(e){
    var final=(e.k==='t'&&e.st==='ok')||(e.k==='p'&&e.st==='entregado');
    if(excess>0&&final){
      S.base+=(e.k==='t'?e.s:-e.c);
      excess--;
    }else keep.push(e);
  });
  S.log=keep;
}

/* ---------- Guardado ---------- */
function persist(){
  prune();
  lastKey=stable(S);
  if(mode==='local'){try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}}
  if(dbDoc){dirty=true;flush();}
}
async function flush(){
  if(writing)return;
  writing=true;
  try{
    while(dirty){
      dirty=false;
      await dbDoc.set(clone(S));
      if(mode==='offline'||mode==='nowrite'){mode='cloud';setSync();}
    }
  }catch(e){
    mode=(e&&e.code==='invalid_argument')?'nowrite':'offline';
    setSync();
  }finally{writing=false;}
}
function setSync(){var el=document.getElementById('sync');if(el)el.textContent=SYNC[mode]||'';}

function loadLocal(){
  try{
    var raw=localStorage.getItem(LS_KEY);
    if(raw){S=normalize(JSON.parse(raw));lastKey=stable(S);}
  }catch(e){}
}

async function init(){
  render();
  var db=null;
  try{if(window.claude&&window.claude.use)db=await window.claude.use('db');}catch(e){}
  if(db){
    dbDoc=db.doc('familia/estado');
    mode='cloud';setSync();
    timer=setTimeout(function(){mode='offline';setSync();},10000);
    dbDoc.onSnapshot(onSnap,function(){clearTimeout(timer);mode='offline';setSync();});
  }else{
    mode='local';
    loadLocal();
    render();
  }
}

function onSnap(snap){
  if(!snap.metadata.fromCache){clearTimeout(timer);if(mode==='offline'){mode='cloud';setSync();}}
  var wasSeen=seen;seen=true;
  if(snap.metadata.hasPendingWrites||writing||dirty)return;
  if(!snap.exists)return;
  var d=normalize(snap.data());
  var k=stable(d);
  if(k===lastKey)return;
  var old=balance(S);
  S=d;lastKey=k;
  var nb=balance(S);
  if(wasSeen&&nb>old)toast('+'+(nb-old)+' '+plural(nb-old)+'. ¡Sigue así!');
  var a=document.activeElement;
  if(a&&a.tagName==='INPUT'&&document.getElementById('app').contains(a)){deferred=true;}
  else render();
}

/* ---------- Vistas ---------- */
function header(){
  var bal=balance(S);
  var prizes=S.prizes.slice().sort(function(a,b){return a.c-b.c;});
  var next=prizes.filter(function(p){return p.c>bal;})[0];
  var can=prizes.filter(function(p){return p.c<=bal;}).length;
  var goal='';
  if(!prizes.length){
    goal='<p>Aún no hay premios para elegir.</p>';
  }else if(next){
    var pct=Math.max(0,Math.min(100,Math.round(bal/next.c*100)));
    goal='<p>Te '+((next.c-bal)===1?'falta ':'faltan ')+(next.c-bal)+' '+plural(next.c-bal)+' para «'+esc(next.n)+'»</p>'+
      '<div class="bar" role="progressbar" aria-label="Avance hacia el próximo premio" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'"><i style="width:'+pct+'%"></i></div>';
  }else{
    goal='<p>¡Ya alcanzas todos los premios!</p>';
  }
  if(can)goal+='<button class="linkbtn" data-act="tab" data-tab="premios">Puedes canjear '+can+(can===1?' premio':' premios')+'. Ver premios</button>';
  return '<header class="band"><div class="inner">'+
    '<h1>Hola, '+esc(S.name)+'</h1>'+
    '<div class="count">'+ICON.star('st-big')+'<span class="num" id="bal">'+bal+'</span><span class="unit">'+plural(bal)+'</span></div>'+
    '<div class="goal">'+goal+'</div></div></header>';
}

function tabsNav(){
  function t(id,label,icon){return '<button class="tab" data-act="tab" data-tab="'+id+'"'+(tab===id?' aria-current="page"':'')+'>'+(icon||'')+label+'</button>';}
  return '<nav class="tabs" aria-label="Secciones">'+t('tareas','Tareas')+t('premios','Premios')+t('papas','Papás',ICON.lock)+'</nav>';
}

function tasksView(){
  var today=todayKey();
  var rows=S.tasks.map(function(t){
    var e=S.log.filter(function(x){return x.k==='t'&&x.tid===t.id&&x.d===today;})[0];
    return {t:t,e:e};
  });
  var ok=rows.filter(function(r){return r.e&&r.e.st==='ok';}).length;
  var wait=rows.filter(function(r){return r.e&&r.e.st==='p';}).length;
  var out='<h2>Tareas de hoy</h2><p class="sub">'+esc(longToday())+'</p>';
  if(!rows.length){
    return out+'<p class="empty">Aún no hay tareas. Pide a mamá o papá que las agreguen en la pestaña Papás.</p>';
  }
  out+='<p class="sub" style="margin-bottom:0">'+ok+' de '+rows.length+' hechas'+(wait?' · '+wait+' esperando confirmación':'')+'</p>';
  out+='<div class="segs" aria-hidden="true">'+rows.map(function(r){return '<i class="'+(r.e?(r.e.st==='ok'?'ok':'p'):'')+'"></i>';}).join('')+'</div>';
  out+='<ul class="list">'+rows.map(function(r){
    var t=r.t,e=r.e,act;
    if(!e)act='<button class="btn" data-act="done" data-id="'+esc(t.id)+'">¡Lo hice!</button>';
    else if(e.st==='p')act='<span class="pill wait">'+ICON.clock+'Esperando OK</span>';
    else act='<span class="pill ok">'+ICON.check+'Hecha</span>';
    return '<li class="task'+(e&&e.st==='ok'?' done':'')+'"><div class="t-main"><span class="name">'+esc(t.n)+'</span><span class="chip">'+ICON.star()+'+'+t.s+'</span></div><div class="t-act">'+act+'</div></li>';
  }).join('')+'</ul>';
  return out;
}

function prizesView(){
  var bal=balance(S);
  var out='<h2>Premios</h2><p class="sub">Junta estrellas y elige el que más te guste.</p>';
  if(!S.prizes.length){
    out+='<p class="empty">Aún no hay premios. Pide a mamá o papá que los agreguen en la pestaña Papás.</p>';
  }else{
    out+='<div class="prizes">'+S.prizes.slice().sort(function(a,b){return a.c-b.c;}).map(function(p){
      var pct=Math.max(0,Math.min(100,Math.round(bal/p.c*100)));
      var can=bal>=p.c,action;
      if(confirmId===p.id){
        action='<div class="confirm"><p>¿Canjear por '+p.c+' '+plural(p.c)+'?</p><button class="btn sm" data-act="redeem" data-id="'+esc(p.id)+'">Sí, canjear</button><button class="btn sm ghost" data-act="cancelask">No</button></div>';
      }else if(can){
        action='<button class="btn" data-act="ask" data-id="'+esc(p.id)+'">Canjear</button>';
      }else{
        action='<button class="btn" disabled>Te '+((p.c-bal)===1?'falta ':'faltan ')+(p.c-bal)+'</button>';
      }
      return '<div class="prize"><h3>'+esc(p.n)+'</h3><div class="cost"><span class="chip">'+ICON.star()+p.c+' '+plural(p.c)+'</span></div>'+
        '<div class="bar on-surface" aria-hidden="true"><i style="width:'+pct+'%"></i></div>'+action+'</div>';
    }).join('')+'</div>';
  }
  var mine=S.log.filter(function(e){return e.k==='p';}).reverse().slice(0,8);
  if(mine.length){
    out+='<div class="panel"><h3>Tus premios</h3><div>'+mine.map(function(e){
      var pill=e.st==='entregado'?'<span class="pill ok">'+ICON.check+'Entregado</span>':'<span class="pill wait">'+ICON.clock+'Por entregar</span>';
      return '<div class="row2"><div class="t-main"><span class="name">'+esc(e.n)+'</span><span class="hint" style="margin:0">'+shortDate(e.d)+' · '+e.c+' '+plural(e.c)+'</span></div>'+pill+'</div>';
    }).join('')+'</div></div>';
  }
  return out;
}

function gateView(){
  return '<form class="panel" id="gate" autocomplete="off">'+
    '<h3>Solo para mamá y papá</h3>'+
    '<p class="sub" style="margin-bottom:0">Escribe el PIN de 4 números para aprobar tareas y cambiar tareas y premios.</p>'+
    '<label class="lbl" for="pin-in">PIN</label>'+
    '<input class="in" id="pin-in" name="pin" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]*" autocomplete="off">'+
    (gateErr?'<p class="err">'+esc(gateErr)+'</p>':'')+
    (S.pin==='1234'?'<p class="hint">PIN inicial: 1234. Cámbialo en Ajustes cuando entres.</p>':'')+
    '<p style="margin:12px 0 0"><button class="btn" type="submit">Entrar</button></p></form>';
}

function parentView(){
  var today=todayKey();
  var pend=S.log.filter(function(e){return e.k==='t'&&e.st==='p';});
  var deliver=S.log.filter(function(e){return e.k==='p'&&e.st==='pedido';});
  var out='<div class="top"><h2>Panel de papás</h2><button class="btn sm ghost" data-act="lock">'+ICON.lock+' Bloquear</button></div>';

  out+='<section class="panel"><h3>Tareas por aprobar</h3>';
  if(!pend.length)out+='<p class="empty">No hay tareas esperando.</p>';
  else out+=pend.map(function(e){
    return '<div class="row2"><div class="t-main"><span class="name">'+esc(e.n)+'</span><span class="chip">'+ICON.star()+'+'+e.s+(e.d!==today?' · '+shortDate(e.d):'')+'</span></div>'+
      '<div class="btns"><button class="btn sm" data-act="approve" data-id="'+esc(e.id)+'">Aprobar</button><button class="btn sm ghost" data-act="reject" data-id="'+esc(e.id)+'">No aún</button></div></div>';
  }).join('');
  out+='</section>';

  out+='<section class="panel"><h3>Premios por entregar</h3>';
  if(!deliver.length)out+='<p class="empty">No hay premios pendientes.</p>';
  else out+=deliver.map(function(e){
    return '<div class="row2"><div class="t-main"><span class="name">'+esc(e.n)+'</span><span class="hint" style="margin:0">'+e.c+' '+plural(e.c)+' · '+shortDate(e.d)+'</span></div>'+
      '<div class="btns"><button class="btn sm" data-act="deliver" data-id="'+esc(e.id)+'">Entregado</button><button class="btn sm ghost" data-act="cancelprize" data-id="'+esc(e.id)+'">Cancelar</button></div></div>';
  }).join('');
  out+='</section>';

  out+='<section class="panel"><h3>Tareas</h3><p class="hint" style="margin-top:0">Las tareas se repiten cada día.</p>'+
    '<div class="colhead"><span>Nombre</span><span>Estrellas</span><span></span></div>'+
    S.tasks.map(function(t){
      return '<div class="erow"><input class="in" id="tn-'+esc(t.id)+'" data-f="tn" data-id="'+esc(t.id)+'" value="'+esc(t.n)+'" maxlength="60" aria-label="Nombre de la tarea">'+
        '<input class="in" id="ts-'+esc(t.id)+'" data-f="ts" data-id="'+esc(t.id)+'" type="number" inputmode="numeric" min="1" max="99" value="'+t.s+'" aria-label="Estrellas de '+esc(t.n)+'">'+
        '<button class="icon-btn" data-act="deltask" data-id="'+esc(t.id)+'" aria-label="Quitar '+esc(t.n)+'">'+ICON.trash+'</button></div>';
    }).join('')+
    '<div class="arow"><input class="in" id="new-task-n" placeholder="Nueva tarea" maxlength="60" aria-label="Nueva tarea">'+
    '<input class="in" id="new-task-s" type="number" inputmode="numeric" min="1" max="99" value="1" aria-label="Estrellas de la nueva tarea">'+
    '<button class="btn sm" data-act="addtask">Agregar</button></div></section>';

  out+='<section class="panel"><h3>Premios</h3>'+
    '<div class="colhead"><span>Nombre</span><span>Costo</span><span></span></div>'+
    S.prizes.map(function(p){
      return '<div class="erow"><input class="in" id="pn-'+esc(p.id)+'" data-f="pn" data-id="'+esc(p.id)+'" value="'+esc(p.n)+'" maxlength="60" aria-label="Nombre del premio">'+
        '<input class="in" id="pc-'+esc(p.id)+'" data-f="pc" data-id="'+esc(p.id)+'" type="number" inputmode="numeric" min="1" max="999" value="'+p.c+'" aria-label="Costo de '+esc(p.n)+'">'+
        '<button class="icon-btn" data-act="delprize" data-id="'+esc(p.id)+'" aria-label="Quitar '+esc(p.n)+'">'+ICON.trash+'</button></div>';
    }).join('')+
    '<div class="arow"><input class="in" id="new-prize-n" placeholder="Nuevo premio" maxlength="60" aria-label="Nuevo premio">'+
    '<input class="in" id="new-prize-c" type="number" inputmode="numeric" min="1" max="999" value="10" aria-label="Costo del nuevo premio">'+
    '<button class="btn sm" data-act="addprize">Agregar</button></div></section>';

  out+='<section class="panel"><h3>Ajustes</h3>'+
    '<label class="lbl" for="cname">Nombre del niño o la niña</label>'+
    '<input class="in" id="cname" data-f="cname" value="'+esc(S.name)+'" maxlength="30">'+
    '<label class="lbl" for="new-pin">Nuevo PIN (4 números)</label>'+
    '<div class="arow" style="grid-template-columns:minmax(0,1fr) auto;margin-top:0"><input class="in" id="new-pin" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]*" autocomplete="off"><button class="btn sm" data-act="savepin">Guardar PIN</button></div>'+
    '</section>';
  return out;
}

function render(){
  renderedDay=todayKey();
  var body=tab==='premios'?prizesView():(tab==='papas'?(unlocked?parentView():gateView()):tasksView());
  document.getElementById('app').innerHTML=header()+
    '<main class="inner main">'+tabsNav()+body+'<p class="sync" id="sync">'+esc(SYNC[mode]||'')+'</p></main>';
  var b=balance(S);
  if(prevBal!==null&&b!==prevBal){
    var el=document.getElementById('bal');
    if(el){el.classList.add('bump');}
  }
  prevBal=b;
  if(tab==='papas'&&!unlocked&&gateErr){var pi=document.getElementById('pin-in');if(pi)pi.focus();}
}

function toast(msg){
  var el=document.getElementById('toast');
  el.innerHTML=ICON.star()+'<span>'+esc(msg)+'</span>';
  el.hidden=false;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){el.hidden=true;},3400);
}

function commit(){persist();render();}

/* ---------- Acciones ---------- */
function find(list,id){return list.filter(function(x){return x.id===id;})[0];}

function act(a,d){
  var id=d.id,e,t,p;
  switch(a){
    case 'tab':
      tab=d.tab;confirmId=null;gateErr='';
      if(location.hash!=='#'+tab)location.hash=tab;
      render();break;
    case 'done':
      t=find(S.tasks,id);if(!t)return;
      if(S.log.some(function(x){return x.k==='t'&&x.tid===id&&x.d===todayKey();}))return;
      S.log.push({id:uid('e'),k:'t',tid:t.id,n:t.n,s:t.s,d:todayKey(),st:'p'});
      commit();toast('¡Buen trabajo! Mamá o papá lo confirmarán.');break;
    case 'ask':confirmId=id;render();break;
    case 'cancelask':confirmId=null;render();break;
    case 'redeem':
      p=find(S.prizes,id);confirmId=null;
      if(!p||balance(S)<p.c){render();return;}
      S.log.push({id:uid('e'),k:'p',pid:p.id,n:p.n,c:p.c,d:todayKey(),st:'pedido'});
      commit();toast('¡Premio pedido! Avisa a mamá o papá.');break;
    case 'approve':
      e=find(S.log,id);if(!e||e.st!=='p')return;
      e.st='ok';commit();toast('Aprobada: +'+e.s+' '+plural(e.s)+' para '+S.name+'.');break;
    case 'reject':
      S.log=S.log.filter(function(x){return x.id!==id;});commit();break;
    case 'deliver':
      e=find(S.log,id);if(!e)return;
      e.st='entregado';commit();break;
    case 'cancelprize':
      S.log=S.log.filter(function(x){return x.id!==id;});commit();toast('Pedido cancelado. Las estrellas volvieron.');break;
    case 'deltask':S.tasks=S.tasks.filter(function(x){return x.id!==id;});commit();break;
    case 'delprize':S.prizes=S.prizes.filter(function(x){return x.id!==id;});commit();break;
    case 'addtask':{
      var n=document.getElementById('new-task-n').value.trim().slice(0,60);
      if(!n){document.getElementById('new-task-n').focus();return;}
      S.tasks.push({id:uid('t'),n:n,s:clampInt(document.getElementById('new-task-s').value,1,99,1)});
      commit();break;}
    case 'addprize':{
      var pn=document.getElementById('new-prize-n').value.trim().slice(0,60);
      if(!pn){document.getElementById('new-prize-n').focus();return;}
      S.prizes.push({id:uid('p'),n:pn,c:clampInt(document.getElementById('new-prize-c').value,1,999,10)});
      commit();break;}
    case 'savepin':{
      var v=document.getElementById('new-pin').value;
      if(!/^\d{4}$/.test(v)){toast('El PIN debe tener 4 números.');return;}
      S.pin=v;commit();toast('PIN guardado.');break;}
    case 'lock':unlocked=false;gateErr='';render();break;
  }
}

function edit(f,el){
  var id=el.dataset.id,v=el.value,t,p;
  if(f==='tn'){t=find(S.tasks,id);var n=v.trim().slice(0,60);if(t&&n)t.n=n;}
  else if(f==='ts'){t=find(S.tasks,id);if(t)t.s=clampInt(v,1,99,t.s);}
  else if(f==='pn'){p=find(S.prizes,id);var m=v.trim().slice(0,60);if(p&&m)p.n=m;}
  else if(f==='pc'){p=find(S.prizes,id);if(p)p.c=clampInt(v,1,999,p.c);}
  else if(f==='cname'){var c=v.trim().slice(0,30);if(c)S.name=c;}
  else return;
  commit();
}

document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]');
  if(b)act(b.dataset.act,b.dataset);
});
document.addEventListener('change',function(ev){
  var f=ev.target.dataset&&ev.target.dataset.f;
  if(f)edit(f,ev.target);
});
document.addEventListener('submit',function(ev){
  if(ev.target.id!=='gate')return;
  ev.preventDefault();
  var v=document.getElementById('pin-in').value;
  if(v===S.pin){unlocked=true;gateErr='';}
  else gateErr='PIN incorrecto. Prueba otra vez.';
  render();
});
document.addEventListener('focusout',function(){
  if(!deferred)return;
  setTimeout(function(){
    var a=document.activeElement;
    if(a&&a.tagName==='INPUT')return;
    deferred=false;render();
  },0);
});
document.addEventListener('visibilitychange',function(){
  if(!document.hidden&&todayKey()!==renderedDay)render();
});
window.addEventListener('hashchange',function(){
  var h=location.hash.replace('#','');
  if((h==='tareas'||h==='premios'||h==='papas')&&h!==tab){tab=h;confirmId=null;render();}
});

(function(){
  var h=location.hash.replace('#','');
  if(h==='tareas'||h==='premios'||h==='papas')tab=h;
})();
init();
})();
</script>
