<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B6E78">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Estrellas">
<title>Estrellas del Hogar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: banda de color con el niño activo y sus estrellas; debajo, una columna con pestañas Tareas / Premios / Papás. */
:root{
  --font-display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --bg:#EEF5F3;
  --surface:#FFFFFF;
  --field:#F6FAF9;
  --ink:#12303A;
  --muted:#56707A;
  --line:#D3E2DF;
  --band:#0B6E78;
  --band-ink:#FFFFFF;
  --band-soft:rgba(255,255,255,.22);
  --btn:#0B6E78;
  --btn-ink:#FFFFFF;
  --star:#F2B01E;
  --star-deep:#B97E00;
  --star-text:#8A5C00;
  --ok:#17744B;
  --ok-bg:#DDF3E7;
  --wait:#9A4F00;
  --wait-bg:#FDEBD0;
  --danger:#B83A27;
  color-scheme:light;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1B1F;--surface:#15292F;--field:#102227;--ink:#E6F1F0;--muted:#93AEB4;--line:#264149;
    --band:#134A52;--band-ink:#F3FBFA;--band-soft:rgba(255,255,255,.16);
    --btn:#3FB7C2;--btn-ink:#05252A;
    --star:#FFC93C;--star-deep:#E3A400;--star-text:#FFC93C;
    --ok:#5FD39B;--ok-bg:#17382B;--wait:#F0A44B;--wait-bg:#3A2B14;--danger:#FF8A75;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1B1F;--surface:#15292F;--field:#102227;--ink:#E6F1F0;--muted:#93AEB4;--line:#264149;
  --band:#134A52;--band-ink:#F3FBFA;--band-soft:rgba(255,255,255,.16);
  --btn:#3FB7C2;--btn-ink:#05252A;
  --star:#FFC93C;--star-deep:#E3A400;--star-text:#FFC93C;
  --ok:#5FD39B;--ok-bg:#17382B;--wait:#F0A44B;--wait-bg:#3A2B14;--danger:#FF8A75;
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--font-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
button,input{font-family:inherit}
:focus-visible{outline:3px solid var(--star);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

.inner{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Avatares */
.av{display:block;width:56px;height:56px;flex:none;border-radius:50%;object-fit:cover;background:var(--field);border:3px solid var(--line)}
.av.ini{display:grid;place-items:center;font:800 24px/1 var(--font-display);color:var(--ink)}
.av.sm{width:32px;height:32px;border-width:2px}
.av.sm.ini{font-size:15px}
.av.lg{width:64px;height:64px}
.band .av{border-color:var(--band-ink);background:var(--band-soft)}
.band .av.ini{color:var(--band-ink)}

/* Banda con el saldo */
.band{background:var(--band);color:var(--band-ink);padding-block:18px 22px}
.who{display:flex;align-items:center;gap:12px}
.band h1{margin:0;font:700 22px/1.2 var(--font-display);overflow-wrap:anywhere}
.kids{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.kidchip{display:inline-flex;align-items:center;gap:8px;max-width:100%;min-height:44px;padding:4px 14px 4px 6px;border:2px solid var(--band-soft);border-radius:99px;background:transparent;color:var(--band-ink);font:700 15px var(--font-display);cursor:pointer}
.kidchip span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
.kidchip[aria-pressed="true"]{background:var(--band-ink);color:var(--band);border-color:var(--band-ink)}
.kidchip[aria-pressed="true"] .av.ini{color:var(--band);background:rgba(0,0,0,.08)}
.count{display:flex;align-items:center;gap:10px;margin-top:10px}
.count .st-big{width:clamp(44px,12vw,60px);height:clamp(44px,12vw,60px);flex:none}
.num{display:inline-block;font:800 clamp(56px,17vw,84px)/1 var(--font-display);font-variant-numeric:tabular-nums}
.unit{align-self:flex-end;padding-bottom:10px;font:700 18px/1 var(--font-display);opacity:.92}
.goal{margin-top:12px}
.goal p{margin:0 0 6px;font-weight:700}
.bar{height:12px;border-radius:999px;background:var(--band-soft);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--star)}
.bar.on-surface{background:var(--line)}
.linkbtn{margin-top:8px;padding:6px 0;min-height:44px;border:0;background:none;color:inherit;font:700 15px var(--font-body);text-decoration:underline;text-underline-offset:3px;cursor:pointer;text-align:left}

/* Pestañas */
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin-top:16px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.tab{min-height:44px;border:0;border-radius:12px;background:transparent;color:var(--ink);font:700 16px var(--font-display);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.tab[aria-current="page"]{background:var(--btn);color:var(--btn-ink)}
.tab .ic{width:16px;height:16px}

.main{padding-block:8px 40px}
h2{margin:14px 0 2px;font:700 22px/1.2 var(--font-display)}
h3{margin:0 0 4px;font:700 18px/1.25 var(--font-display)}
.sub{margin:0 0 12px;color:var(--muted)}
.segs{display:flex;gap:4px;margin:6px 0 14px}
.segs i{flex:1;height:8px;border-radius:99px;background:var(--line)}
.segs i.ok{background:var(--ok)}
.segs i.p{background:var(--star)}

.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.task{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.t-main{min-width:0;display:flex;flex-direction:column;gap:2px}
.name{font-weight:800;overflow-wrap:anywhere}
.task.done .name{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;font-weight:800;color:var(--star-text)}
.st{width:18px;height:18px;flex:none}
.t-act{flex:none}

.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;font-weight:800;font-size:14px;white-space:nowrap}
.pill .ic{width:16px;height:16px}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.wait{background:var(--wait-bg);color:var(--wait)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border:0;border-radius:12px;background:var(--btn);color:var(--btn-ink);font:700 16px var(--font-display);cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--line)}
.btn.sm{padding:0 12px;font-size:15px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.sr-only:focus-visible+.filebtn{outline:3px solid var(--star);outline-offset:2px}
.icon-btn{width:44px;height:44px;border:1.5px solid var(--line);border-radius:10px;background:transparent;color:var(--danger);cursor:pointer;display:grid;place-items:center}
.icon-btn[disabled]{opacity:.4;cursor:not-allowed}
.icon-btn .ic{width:20px;height:20px}

.prizes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.prize{display:flex;flex-direction:column;gap:10px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.prize h3{margin:0;overflow-wrap:anywhere}
.pimg{display:block;width:100%;max-width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:12px;background:var(--line)}
.cost{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:800}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.confirm p{margin:0;flex-basis:100%;font-weight:700}

.panel{margin-top:14px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.row2{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.row2:first-of-type{border-top:0}
.row2 .t-main{flex:1 1 160px}
.row2 .lead{display:flex;align-items:center;gap:10px;flex:1 1 180px;min-width:0}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.empty{margin:0;color:var(--muted)}
.lbl{display:block;margin:10px 0 4px;font-weight:700;font-size:14px}
.in{width:100%;min-width:0;min-height:44px;padding:0 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink);font:600 16px var(--font-body)}
.erow{display:grid;grid-template-columns:minmax(0,1fr) 72px 44px;gap:8px;align-items:center;margin-top:8px}
.arow{display:grid;grid-template-columns:minmax(0,1fr) 72px auto;gap:8px;align-items:center;margin-top:12px}
.arow.two{grid-template-columns:minmax(0,1fr) auto}
.colhead{display:grid;grid-template-columns:minmax(0,1fr) 72px 44px;gap:8px;font-size:13px;font-weight:700;color:var(--muted);margin-top:8px}
.edit-card{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--bg)}
.media-row{display:flex;align-items:center;gap:12px;margin-top:10px}
.media-row .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.thumb{display:block;width:64px;height:64px;flex:none;border-radius:10px;object-fit:cover;background:var(--line);border:1px solid var(--line)}
.thumb.sm{width:44px;height:44px;border-radius:8px}
.err{margin:8px 0 0;color:var(--danger);font-weight:700}
.hint{margin:8px 0 0;color:var(--muted);font-size:14px}
.hint a{color:var(--ink);font-weight:700}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sync{margin:24px 0 0;color:var(--muted);font-size:13px}

.toast{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:480px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:700;z-index:20}
.ic{width:1.1em;height:1.1em;flex:none}

@media (prefers-reduced-motion:no-preference){
  .bar>i{transition:width .45s ease}
  .bump{animation:bump .5s}
  @keyframes bump{40%{transform:scale(1.18)}}
  .toast:not([hidden]){animation:rise .25s ease-out}
  @keyframes rise{from{transform:translateY(12px);opacity:0}}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
'use strict';

var LS_KEY='estrellas-del-hogar-v1';

function defaults(){
  return {
    v:2,pin:'1234',active:'k1',
    kids:[{id:'k1',name:'Campeón',photo:null,base:0,log:[]}],
    tasks:[
      {id:'t1',n:'Tender la cama',s:1},
      {id:'t2',n:'Recoger los juguetes',s:1},
      {id:'t3',n:'Lavar los platos',s:2},
      {id:'t4',n:'Sacar la basura',s:2},
      {id:'t5',n:'Barrer la sala',s:2},
      {id:'t6',n:'Ayudar a cocinar',s:3}
    ],
    prizes:[
      {id:'p1',n:'Elegir la película de la noche',c:10,img:null,url:''},
      {id:'p2',n:'30 minutos extra de tablet',c:15,img:null,url:''},
      {id:'p3',n:'Un helado',c:20,img:null,url:''},
      {id:'p4',n:'Salida al parque',c:30,img:null,url:''},
      {id:'p5',n:'Un juguete pequeño',c:60,img:null,url:''}
    ]
  };
}

var S=defaults();
var tab='tareas',unlocked=false,confirmId=null,confirmKid=null,gateErr='';
var storageOK=true,lastGood='',toastTimer=null,prevBal=null,renderedDay='',busy={};

var ICON={
  star:function(c){return '<svg class="'+(c||'st')+'" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6l2.9 6.1 6.7.9-4.9 4.7 1.2 6.6L12 17.6l-5.9 3.3 1.2-6.6L2.4 9.6l6.7-.9z" fill="var(--star)" stroke="var(--star-deep)" stroke-width="1.4" stroke-linejoin="round"/></svg>';},
  check:'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  clock:'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 7v5.5l3.5 2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  trash:'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 7V4.5h4V7m-8.5 0l1 12.5h11l1-12.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  lock:'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8.5 10.5V8a3.5 3.5 0 017 0v2.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  cart:'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2.5l2 11h10l2-8H7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="19.5" r="1.5" fill="currentColor"/><circle cx="17" cy="19.5" r="1.5" fill="currentColor"/></svg>'
};

function clone(o){return JSON.parse(JSON.stringify(o));}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function todayKey(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function shortDate(k){var p=k.split('-');return p[2]+'/'+p[1];}
function longToday(){
  var s=new Date().toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'});
  return s.charAt(0).toUpperCase()+s.slice(1);
}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function plural(n){return n===1?'estrella':'estrellas';}
function clampInt(v,min,max,fallback){var n=parseInt(v,10);if(!isFinite(n))return fallback;return Math.max(min,Math.min(max,n));}
function find(list,id){return list.filter(function(x){return x.id===id;})[0];}
function isImg(s){return typeof s==='string'&&s.indexOf('data:image/')===0;}

/* Acepta "amazon.com/...", "https://..." y rechaza cualquier otro tipo de enlace. */
function cleanUrl(v){
  v=String(v||'').trim();
  if(!v)return '';
  if(v.length>800)return null;
  if(!/^[a-z][a-z0-9+.-]*:/i.test(v))v='https://'+v;
  try{
    var u=new URL(v);
    if(u.protocol!=='https:'&&u.protocol!=='http:')return null;
    return u.href;
  }catch(e){return null;}
}
function hostOf(u){try{return new URL(u).hostname.replace(/^www\./,'');}catch(e){return '';}}

/* Convierte los datos guardados (también los de la versión de un solo niño) al formato actual. */
function normalize(d){
  var o=clone(d),kids;
  if(Array.isArray(o.kids)&&o.kids.length){
    kids=o.kids.map(function(k){
      return {
        id:String(k.id||uid('k')),
        name:(typeof k.name==='string'&&k.name)?k.name:'Niño',
        photo:isImg(k.photo)?k.photo:null,
        base:isFinite(k.base)?k.base:0,
        log:Array.isArray(k.log)?k.log:[]
      };
    });
  }else{
    kids=[{id:'k1',name:(typeof o.name==='string'&&o.name)?o.name:'Campeón',photo:null,base:isFinite(o.base)?o.base:0,log:Array.isArray(o.log)?o.log:[]}];
  }
  return {
    v:2,
    pin:/^\d{4}$/.test(o.pin)?String(o.pin):'1234',
    active:find(kids,o.active)?o.active:kids[0].id,
    kids:kids,
    tasks:Array.isArray(o.tasks)?o.tasks:[],
    prizes:(Array.isArray(o.prizes)?o.prizes:[]).map(function(p){
      var u=cleanUrl(p.url);
      return {id:String(p.id||uid('p')),n:p.n,c:p.c,img:isImg(p.img)?p.img:null,url:u||''};
    })
  };
}

function kid(){return find(S.kids,S.active)||S.kids[0];}
function balance(k){
  var b=k.base||0;
  k.log.forEach(function(e){
    if(e.k==='t'&&e.st==='ok')b+=e.s;
    else if(e.k==='p')b-=e.c;
  });
  return b;
}
function findEntry(id){
  for(var i=0;i<S.kids.length;i++){
    var e=find(S.kids[i].log,id);
    if(e)return {k:S.kids[i],e:e};
  }
  return null;
}

/* Los movimientos viejos ya cerrados se suman a "base" para que los datos no crezcan sin límite. */
function prune(){
  S.kids.forEach(function(k){
    if(k.log.length<=300)return;
    var keep=[],excess=k.log.length-250;
    k.log.forEach(function(e){
      var done=(e.k==='t'&&e.st==='ok')||(e.k==='p'&&e.st==='entregado');
      if(excess>0&&done){k.base+=(e.k==='t'?e.s:-e.c);excess--;}
      else keep.push(e);
    });
    k.log=keep;
  });
}

/* ---------- Guardado en este dispositivo ---------- */
function persist(){
  prune();
  var json=JSON.stringify(S);
  if(!storageOK){lastGood=json;return true;}
  try{localStorage.setItem(LS_KEY,json);lastGood=json;return true;}
  catch(e){
    if(lastGood)S=normalize(JSON.parse(lastGood));
    return false;
  }
}
function load(){
  try{localStorage.setItem(LS_KEY+'-test','1');localStorage.removeItem(LS_KEY+'-test');}
  catch(e){storageOK=false;}
  try{
    var raw=storageOK?localStorage.getItem(LS_KEY):null;
    if(raw){S=normalize(JSON.parse(raw));}
  }catch(e){S=defaults();}
  lastGood=JSON.stringify(S);
}
function commit(){
  var ok=persist();
  render();
  if(!ok)toast('No hay espacio para guardar. Quita alguna foto e inténtalo de nuevo.');
}

/* ---------- Fotos ---------- */
function readImage(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),im=new Image();
    im.onload=function(){URL.revokeObjectURL(url);res(im);};
    im.onerror=function(){URL.revokeObjectURL(url);rej(new Error('img'));};
    im.src=url;
  });
}
async function shrink(file,mode){
  var im=await readImage(file),sw=im.naturalWidth,sh=im.naturalHeight;
  if(!sw||!sh)throw new Error('img');
  var c=document.createElement('canvas'),x=c.getContext('2d');
  x.fillStyle='#ffffff';
  if(mode==='square'){
    var s=Math.min(sw,sh);
    c.width=c.height=256;
    x.fillRect(0,0,256,256);
    x.drawImage(im,(sw-s)/2,(sh-s)/2,s,s,0,0,256,256);
    return c.toDataURL('image/jpeg',0.85);
  }
  var k=Math.min(1,560/Math.max(sw,sh));
  c.width=Math.round(sw*k);c.height=Math.round(sh*k);
  x.fillRect(0,0,c.width,c.height);
  x.drawImage(im,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',0.8);
}
async function handleFile(f,el){
  var file=el.files&&el.files[0],id=el.dataset.id;
  if(!file)return;
  if(file.type&&file.type.indexOf('image/')!==0){toast('Elige un archivo de imagen.');el.value='';return;}
  try{
    var data=await shrink(file,f==='kphoto'?'square':'fit');
    if(f==='kphoto'){var k=find(S.kids,id);if(k)k.photo=data;}
    else{var p=find(S.prizes,id);if(p)p.img=data;}
    commit();
  }catch(e){toast('No pude leer esa imagen. Prueba con otra.');}
  el.value='';
}

/* ---------- Foto automática desde el enlace de compra ----------
   Un navegador no puede leer otra tienda directamente, así que se usan dos servicios externos:
   Microlink (encuentra la imagen principal de la página) e images.weserv.nl (la entrega reducida y legible). */
async function productImage(url){
  var ctl=new AbortController(),tm=setTimeout(function(){ctl.abort();},20000);
  try{
    var r=await fetch('https://api.microlink.io/?url='+encodeURIComponent(url),{signal:ctl.signal});
    if(!r.ok)throw new Error('preview');
    var j=await r.json();
    var img=j&&j.data&&j.data.image&&j.data.image.url;
    if(j.status!=='success'||typeof img!=='string'||!/^https?:\/\//i.test(img))throw new Error('noimage');
    var r2=await fetch('https://images.weserv.nl/?url='+encodeURIComponent(img)+'&w=700&output=jpg&q=85',{signal:ctl.signal});
    if(!r2.ok)throw new Error('proxy');
    var blob=await r2.blob();
    if(!blob.size)throw new Error('empty');
    return await shrink(blob,'fit');
  }finally{clearTimeout(tm);}
}
async function autoImage(id){
  var p=find(S.prizes,id);
  if(!p||!p.url||busy[id])return;
  var url=p.url,data=null,ok=false;
  busy[id]=true;render();
  toast('Buscando la foto del producto…');
  try{data=await productImage(url);ok=true;}catch(e){}
  delete busy[id];
  p=find(S.prizes,id);
  if(!p||p.url!==url){render();return;}
  if(ok){
    p.img=data;
    var saved=persist();
    render();
    toast(saved?'Foto del producto agregada.':'No hay espacio para guardar la foto. Quita alguna otra.');
  }else{
    render();
    toast('No pude traer la foto de ese enlace. Puedes subirla tú.');
  }
}

/* ---------- Acciones ---------- */
function act(a,d){
  var id=d.id,r,t,p,k;
  switch(a){
    case 'tab':
      tab=d.tab;confirmId=null;confirmKid=null;gateErr='';
      if(location.hash!=='#'+tab)location.hash=tab;
      render();break;
    case 'kid':
      if(!find(S.kids,id))return;
      S.active=id;confirmId=null;prevBal=null;commit();break;
    case 'done':
      k=kid();t=find(S.tasks,id);if(!t)return;
      if(k.log.some(function(x){return x.k==='t'&&x.tid===id&&x.d===todayKey();}))return;
      k.log.push({id:uid('e'),k:'t',tid:t.id,n:t.n,s:t.s,d:todayKey(),st:'p'});
      commit();toast('¡Buen trabajo! Mamá o papá lo confirmarán.');break;
    case 'ask':confirmId=id;render();break;
    case 'cancelask':confirmId=null;render();break;
    case 'redeem':
      k=kid();p=find(S.prizes,id);confirmId=null;
      if(!p||balance(k)<p.c){render();return;}
      k.log.push({id:uid('e'),k:'p',pid:p.id,n:p.n,c:p.c,d:todayKey(),st:'pedido'});
      commit();toast('¡Premio pedido! Avisa a mamá o papá.');break;
    case 'approve':
      r=findEntry(id);if(!r||r.e.st!=='p')return;
      r.e.st='ok';commit();toast('Aprobada: +'+r.e.s+' '+plural(r.e.s)+' para '+r.k.name+'.');break;
    case 'reject':
      r=findEntry(id);if(!r)return;
      r.k.log=r.k.log.filter(function(x){return x.id!==id;});commit();break;
    case 'deliver':
      r=findEntry(id);if(!r)return;
      r.e.st='entregado';commit();break;
    case 'cancelprize':
      r=findEntry(id);if(!r)return;
      r.k.log=r.k.log.filter(function(x){return x.id!==id;});commit();toast('Pedido cancelado. Las estrellas volvieron.');break;
    case 'addkid':{
      var kn=document.getElementById('new-kid-n').value.trim().slice(0,30);
      if(!kn){document.getElementById('new-kid-n').focus();return;}
      S.kids.push({id:uid('k'),name:kn,photo:null,base:0,log:[]});
      commit();toast(kn+' ya está en la lista. Agrégale una foto si quieres.');break;}
    case 'delkid':confirmKid=id;render();break;
    case 'cancelkid':confirmKid=null;render();break;
    case 'delkid2':
      if(S.kids.length<2){confirmKid=null;render();return;}
      S.kids=S.kids.filter(function(x){return x.id!==id;});
      if(S.active===id)S.active=S.kids[0].id;
      confirmKid=null;prevBal=null;commit();break;
    case 'rmkphoto':k=find(S.kids,id);if(k)k.photo=null;commit();break;
    case 'fetchimg':autoImage(id);break;
    case 'rmpimg':p=find(S.prizes,id);if(p)p.img=null;commit();break;
    case 'deltask':S.tasks=S.tasks.filter(function(x){return x.id!==id;});commit();break;
    case 'delprize':S.prizes=S.prizes.filter(function(x){return x.id!==id;});commit();break;
    case 'addtask':{
      var n=document.getElementById('new-task-n').value.trim().slice(0,60);
      if(!n){document.getElementById('new-task-n').focus();return;}
      S.tasks.push({id:uid('t'),n:n,s:clampInt(document.getElementById('new-task-s').value,1,99,1)});
      commit();break;}
    case 'addprize':{
      var pn=document.getElementById('new-prize-n').value.trim().slice(0,60);
      if(!pn){document.getElementById('new-prize-n').focus();return;}
      S.prizes.push({id:uid('p'),n:pn,c:clampInt(document.getElementById('new-prize-c').value,1,999,10),img:null,url:''});
      commit();break;}
    case 'savepin':{
      var v=document.getElementById('new-pin').value;
      if(!/^\d{4}$/.test(v)){toast('El PIN debe tener 4 números.');return;}
      S.pin=v;commit();toast('PIN guardado.');break;}
    case 'lock':unlocked=false;gateErr='';render();break;
  }
}

function edit(f,el){
  var id=el.dataset.id,v=el.value,t,p,k;
  if(f==='tn'){t=find(S.tasks,id);var n=v.trim().slice(0,60);if(t&&n)t.n=n;}
  else if(f==='ts'){t=find(S.tasks,id);if(t)t.s=clampInt(v,1,99,t.s);}
  else if(f==='pn'){p=find(S.prizes,id);var m=v.trim().slice(0,60);if(p&&m)p.n=m;}
  else if(f==='pc'){p=find(S.prizes,id);if(p)p.c=clampInt(v,1,999,p.c);}
  else if(f==='kname'){k=find(S.kids,id);var c=v.trim().slice(0,30);if(k&&c)k.name=c;}
  else if(f==='purl'){
    p=find(S.prizes,id);
    var u=cleanUrl(v);
    if(u===null){toast('Ese enlace no parece válido. Debe empezar con https://');render();return;}
    if(p)p.url=u;
  }
  else return;
  commit();
  if(f==='purl'){var pp=find(S.prizes,id);if(pp&&pp.url&&!pp.img)autoImage(id);}
}

document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]');
  if(b&&!b.disabled)act(b.dataset.act,b.dataset);
});
document.addEventListener('change',function(ev){
  var el=ev.target,f=el.dataset&&el.dataset.f;
  if(!f)return;
  if(el.type==='file')handleFile(f,el);
  else edit(f,el);
});
document.addEventListener('submit',function(ev){
  if(ev.target.id!=='gate')return;
  ev.preventDefault();
  var v=document.getElementById('pin-in').value;
  if(v===S.pin){unlocked=true;gateErr='';}
  else gateErr='PIN incorrecto. Prueba otra vez.';
  render();
});
document.addEventListener('visibilitychange',function(){
  if(!document.hidden&&todayKey()!==renderedDay)render();
});
window.addEventListener('hashchange',function(){
  var h=location.hash.replace('#','');
  if((h==='tareas'||h==='premios'||h==='papas')&&h!==tab){tab=h;confirmId=null;render();}
});

(function(){
  var h=location.hash.replace('#','');
  if(h==='tareas'||h==='premios'||h==='papas')tab=h;
})();
load();
render();
})();
</script>
</body>
</html>
